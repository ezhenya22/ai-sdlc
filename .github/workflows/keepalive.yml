# Keeps the Supabase Free project from pausing (it pauses after about a week of low database activity:
# https://supabase.com/docs/guides/platform/free-project-pausing). Once a day this calls keepalive(), which writes
# one heartbeat row (see supabase/ops/keepalive.sql). A failed run means the project may be paused or the
# function is gone, and GitHub emails the repo owner about failed scheduled runs.
# The publishable key is public by design (it is already in spike/index.html); row-level security protects the data.
name: supabase keep-alive

on:
  schedule:
    - cron: '17 15 * * *'   # daily, 15:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://nmbvqcwzulhdktzhcpbf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_UfFW1PUNAP7F2RMgCgWAVQ_J_V_KFEd
    steps:
      - name: Call keepalive()
        run: |
          for attempt in 1 2 3; do
            if out=$(curl -sS --fail-with-body --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
                 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'); then
              echo "heartbeat written at $out"; exit 0
            fi
            echo "attempt $attempt failed: $out"; sleep 20
          done
          exit 1
